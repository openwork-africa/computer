// The first line of an autoconfig file is skipped. Loads the recorder (/usr/lib/openwork-recorder) as a temporary
// add-on, the way about:debugging does, once Firefox's window is up. It is loaded again on every start.
try {
  const { AddonManager } = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
  const { FileUtils } = ChromeUtils.importESModule("resource://gre/modules/FileUtils.sys.mjs");
  const load = () => {
    Services.obs.removeObserver(load, "final-ui-startup");
    AddonManager.installTemporaryAddon(new FileUtils.File("/usr/lib/openwork-recorder")).catch((e) => Cu.reportError(e));
  };
  Services.obs.addObserver(load, "final-ui-startup");
} catch (e) {
  Components.utils.reportError(e);
}
